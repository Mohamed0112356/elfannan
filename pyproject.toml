[project]
name = "elfannan"
version = "0.1.0"
description = "AI Artist Engine - orchestration layer for a persistent virtual music artist"
requires-python = ">=3.12,<3.13"
readme = "README.md"

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/elfannan"]
